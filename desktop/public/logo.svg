<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="24" height="24">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D4D4D4"/>
      <stop offset="100%" stop-color="#8A8A8A"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer container in matte black -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#darkBg)" stroke="#262626" stroke-width="1.8"/>

  <!-- Outer Desktop Frame in slate gray -->
  <rect x="18" y="20" width="64" height="44" rx="8" fill="none" stroke="#404040" stroke-width="2" />

  <!-- Phone Silhouette in obsidian with silver outline -->
  <rect x="36" y="26" width="28" height="50" rx="6" fill="#0A0A0A" stroke="url(#silverGrad)" stroke-width="2.2" filter="url(#subtleGlow)"/>
  
  <!-- Speaker slit -->
  <rect x="44" y="30" width="12" height="2" rx="1" fill="#525252"/>
  
  <!-- Home indicator dot -->
  <circle cx="50" cy="71" r="2.2" fill="#E5E5E5" />

  <!-- '66' badge in bright silver -->
  <text x="50" y="52" fill="#F5F5F5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">66</text>
</svg>
